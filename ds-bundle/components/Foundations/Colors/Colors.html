<!-- @dsCard group="Foundations" -->
<link rel="stylesheet" href="../../../styles.css">
<div style="padding: 24px; background: var(--bg); font-family: 'Hanken Grotesk', sans-serif;">
  <div style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 21px; letter-spacing: -0.02em; margin-bottom: 16px;">Colors</div>
  <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px;">
    <div style="border: 1px solid var(--border); border-radius: 10px; overflow: hidden; background: var(--panel);">
      <div style="height: 56px; background: var(--bg); border-bottom: 1px solid var(--border);"></div>
      <div style="padding: 8px 10px;"><div style="font-size: 13px; font-weight: 600;">--bg</div><div style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--faint);">#FBFBF9</div></div>
    </div>
    <div style="border: 1px solid var(--border); border-radius: 10px; overflow: hidden; background: var(--panel);">
      <div style="height: 56px; background: var(--panel); border-bottom: 1px solid var(--border);"></div>
      <div style="padding: 8px 10px;"><div style="font-size: 13px; font-weight: 600;">--panel</div><div style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--faint);">#FFFFFF</div></div>
    </div>
    <div style="border: 1px solid var(--border); border-radius: 10px; overflow: hidden; background: var(--panel);">
      <div style="height: 56px; background: var(--ink);"></div>
      <div style="padding: 8px 10px;"><div style="font-size: 13px; font-weight: 600;">--ink</div><div style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--faint);">#1B1A17</div></div>
    </div>
    <div style="border: 1px solid var(--border); border-radius: 10px; overflow: hidden; background: var(--panel);">
      <div style="height: 56px; background: var(--muted);"></div>
      <div style="padding: 8px 10px;"><div style="font-size: 13px; font-weight: 600;">--muted</div><div style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--faint);">#75736C</div></div>
    </div>
    <div style="border: 1px solid var(--border); border-radius: 10px; overflow: hidden; background: var(--panel);">
      <div style="height: 56px; background: var(--faint);"></div>
      <div style="padding: 8px 10px;"><div style="font-size: 13px; font-weight: 600;">--faint</div><div style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--faint);">#A9A79F</div></div>
    </div>
    <div style="border: 1px solid var(--border); border-radius: 10px; overflow: hidden; background: var(--panel);">
      <div style="height: 56px; background: var(--border);"></div>
      <div style="padding: 8px 10px;"><div style="font-size: 13px; font-weight: 600;">--border</div><div style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--faint);">#ECEAE3</div></div>
    </div>
    <div style="border: 1px solid var(--border); border-radius: 10px; overflow: hidden; background: var(--panel);">
      <div style="height: 56px; background: var(--border-strong);"></div>
      <div style="padding: 8px 10px;"><div style="font-size: 13px; font-weight: 600;">--border-strong</div><div style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--faint);">#DEDCD4</div></div>
    </div>
    <div style="border: 1px solid var(--border); border-radius: 10px; overflow: hidden; background: var(--panel);">
      <div style="height: 56px; background: var(--field-bg); border-bottom: 1px solid var(--border);"></div>
      <div style="padding: 8px 10px;"><div style="font-size: 13px; font-weight: 600;">--field-bg</div><div style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--faint);">#FAFAF8</div></div>
    </div>
    <div style="border: 1px solid var(--border); border-radius: 10px; overflow: hidden; background: var(--panel);">
      <div style="height: 56px; background: var(--field-border);"></div>
      <div style="padding: 8px 10px;"><div style="font-size: 13px; font-weight: 600;">--field-border</div><div style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--faint);">#E2E0D8</div></div>
    </div>
    <div style="border: 1px solid var(--border); border-radius: 10px; overflow: hidden; background: var(--panel);">
      <div style="height: 56px; background: var(--accent);"></div>
      <div style="padding: 8px 10px;"><div style="font-size: 13px; font-weight: 600;">--accent</div><div style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--faint);">#2E5BFF</div></div>
    </div>
    <div style="border: 1px solid var(--border); border-radius: 10px; overflow: hidden; background: var(--panel);">
      <div style="height: 56px; background: var(--accent-soft); border-bottom: 1px solid var(--border);"></div>
      <div style="padding: 8px 10px;"><div style="font-size: 13px; font-weight: 600;">--accent-soft</div><div style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--faint);">#EEF1FF</div></div>
    </div>
  </div>
</div>
